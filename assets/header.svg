<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Prince R — Full-Stack Web Developer &amp; AI Enthusiast</title>
  <desc id="dsc">Minimal dark banner with a single lavender accent, hairline grid, concentric rings and kinetic typography</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap');
      .h  { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
      .b  { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#010102"/>
      <stop offset=".45"  stop-color="#0F1011"/>
      <stop offset="1"    stop-color="#010102"/>
    </linearGradient>

    <!-- the one chromatic accent: a single focused glow, not an atmosphere -->
    <radialGradient id="orbAccent" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(255 95) scale(360)">
      <stop offset="0"   stop-color="#5E6AD2" stop-opacity=".34"/>
      <stop offset=".5"  stop-color="#5E6AD2" stop-opacity=".09"/>
      <stop offset="1"   stop-color="#5E6AD2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="beam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(600 -80) scale(560 280)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="72" y1="150" x2="600" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F7F8F8"/>
      <stop offset="1"   stop-color="#D0D6E0"/>
    </linearGradient>

    <linearGradient id="rule" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#23252A" stop-opacity="0"/>
      <stop offset=".18" stop-color="#23252A" stop-opacity="1"/>
      <stop offset=".48" stop-color="#5E6AD2" stop-opacity=".9"/>
      <stop offset=".78" stop-color="#23252A" stop-opacity="1"/>
      <stop offset="1"   stop-color="#23252A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E6AD2" stop-opacity=".5"/>
      <stop offset="1" stop-color="#23252A" stop-opacity=".7"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="420" rx="26"/></clipPath>

    <mask id="nameMask">
      <rect width="1200" height="420" fill="#000"/>
      <text class="h" x="72" y="214" font-size="90" font-weight="700" letter-spacing="-3" fill="#fff">Prince R</text>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base -->
    <rect width="1200" height="420" fill="url(#bg)"/>

    <!-- One accent glow + a neutral top light -->
    <g filter="url(#soft)">
      <rect width="1200" height="420" fill="url(#orbAccent)">
        <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect width="1200" height="420" fill="url(#beam)"/>
    </g>

    <!-- Hairline grid -->
    <g stroke="#FFFFFF" stroke-opacity=".035">
      <path d="M300 0V420M600 0V420M900 0V420"/>
      <path d="M0 140H1200M0 280H1200"/>
    </g>

    <!-- Decorative concentric rings (right) -->
    <g transform="translate(1005 210)" fill="none" stroke="url(#ringStroke)">
      <circle r="150" stroke-opacity=".45"/>
      <circle r="110" stroke-opacity=".34"/>
      <circle r="70"  stroke-opacity=".24"/>
      <circle r="4" fill="#828FFF" stroke="none">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <animateMotion dur="14s" repeatCount="indefinite" path="M150 0 A150 150 0 1 1 -150 0 A150 150 0 1 1 150 0"/>
      </circle>
      <circle r="3" fill="#5E6AD2" stroke="none">
        <animateMotion dur="9s" repeatCount="indefinite" path="M-110 0 A110 110 0 1 0 110 0 A110 110 0 1 0 -110 0"/>
      </circle>
    </g>

    <!-- Floating particles -->
    <g fill="#828FFF">
      <circle cx="150" cy="330" r="2" opacity=".7">
        <animate attributeName="cy" values="330;300;330" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;.2;.7" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="120" r="1.6" opacity=".5">
        <animate attributeName="cy" values="120;96;120" dur="8.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="350" r="1.8" opacity=".45">
        <animate attributeName="cy" values="350;324;350" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Eyebrow tag -->
    <g>
      <rect x="72" y="98" width="286" height="30" rx="15" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".10"/>
      <circle cx="92" cy="113" r="3.5" fill="#5E6AD2">
        <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text class="b" x="106" y="118" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="#8A8F98">FULL-STACK · AI · SYSTEMS</text>
    </g>

    <!-- Name -->
    <text class="h" x="72" y="214" font-size="90" font-weight="700" letter-spacing="-3" fill="url(#nameFill)">Prince R</text>
    <!-- Kinetic shimmer across the name -->
    <g mask="url(#nameMask)">
      <rect x="-400" y="120" width="360" height="140" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="translate"
                          values="-360 0; 1500 0" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Punchline -->
    <text class="b" x="74" y="256" font-size="19" font-weight="400" fill="#8A8F98" letter-spacing=".2">
      I build the fast, obvious thing — then make it feel effortless.
    </text>

    <!-- Tech chips -->
    <g class="b" font-size="12.5" font-weight="600" letter-spacing=".4">
      <g fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".10">
        <rect x="72"  y="286" width="104" height="32" rx="16"/>
        <rect x="186" y="286" width="66"  height="32" rx="16"/>
        <rect x="262" y="286" width="80"  height="32" rx="16"/>
        <rect x="352" y="286" width="80"  height="32" rx="16"/>
        <rect x="442" y="286" width="74"  height="32" rx="16"/>
        <rect x="526" y="286" width="80"  height="32" rx="16"/>
      </g>
      <g fill="#D0D6E0">
        <text x="124" y="307" text-anchor="middle">TypeScript</text>
        <text x="219" y="307" text-anchor="middle">React</text>
        <text x="302" y="307" text-anchor="middle">Next.js</text>
        <text x="392" y="307" text-anchor="middle">Node.js</text>
        <text x="479" y="307" text-anchor="middle">Python</text>
        <text x="566" y="307" text-anchor="middle">AI / ML</text>
      </g>
    </g>

    <!-- Bottom hairline rule -->
    <rect x="72" y="372" width="1056" height="1.2" fill="url(#rule)">
      <animate attributeName="opacity" values=".55;1;.55" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Film grain -->
    <rect width="1200" height="420" filter="url(#grain)" opacity=".03"/>
  </g>

  <!-- Double-bezel frame -->
  <rect x="0.6" y="0.6" width="1198.8" height="418.8" rx="25.4" fill="none" stroke="#FFFFFF" stroke-opacity=".10"/>
</svg>
